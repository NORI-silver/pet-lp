# 一時の補助。/hosp.js と /find.js を上限に収めるため、共通の部品（tools/prefkeep.py）の空白を落とし、生成ファイルを作り直す。終わったら消す。
name: os-trn-helper
on:
  push:
    branches: ['photo-os-trn-1125']
    paths: ['.github/workflows/os-trn-helper.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 大阪のドッグトレーナーの写真を入れる
        run: |
          pip install pillow
          cp tools/5-os_trn_data.json tools/os_trn_data.json
          python3 tools/4-os_trn_apply.py
          ls img/fac/trainer | wc -l
      - name: 生成ファイルを作り直す
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
          wc -c hosp.js find.js
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/4-os_trn_apply.py tools/5-os_trn_data.json tools/os_trn_data.json
          git add -A
          git reset -q .github/workflows/os-trn-helper.yml
          git commit -qm "大阪のドッグトレーナーに公式サイトの写真を追加"
          git push
