# 茨城・栃木・群馬の網羅用。site-snap と同じしくみで、queue・reg は tools/crawl/nkt/、結果はブランチ crawl-out-nkt。
# 何も送らない・サイトは書き換えない。
name: site-snap-nkt
on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-0verl3']
    paths: ['tools/crawl/nkt/**', 'tools/crawl_nkt.py']
permissions:
  contents: write
concurrency:
  group: site-snap-nkt
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 読む
        run: python3 tools/crawl_nkt.py /tmp/out
      - name: 結果をブランチ crawl-out-nkt に置く
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan crawl-out-nkt
          git rm -rq --cached . && git clean -fdq
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "北関東の抜き出し ${GITHUB_SHA::7}"
          git push -q -f origin crawl-out-nkt
