name: One-shot Kanagawa SEO update

on:
  push:
    branches:
      - chatgpt/seo-kanagawa-gsc

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/seo-kanagawa-gsc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Search Console driven SEO changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/gen_areas.py')
          s = p.read_text(encoding='utf-8')

          old = 'dict(slug="kanagawa", pref="神奈川県", short="神奈川・横浜", count=5,'
          new = 'dict(slug="kanagawa", pref="神奈川県", short="神奈川・横浜", h1="神奈川・横浜・川崎", count=5,'
          assert old in s
          s = s.replace(old, new, 1)

          old = '("神奈川でペットタクシーを使う理由", "横浜市や川崎市は坂道や丘の上の住宅地が多く、大型犬やシニアの子を連れて歩いたり、公共交通で移動したりするのは大変です。ペットタクシーなら玄関先まで迎えに来てくれるので、抱っこやキャリーで長く歩かせる必要がありません。"),'
          new = '("神奈川・横浜・川崎でペットタクシーを使う理由", "横浜市や川崎市は坂道や丘の上の住宅地が多く、大型犬やシニアの子を連れて歩いたり、公共交通で移動したりするのは大変です。ペットタクシーなら玄関先まで迎えに来てくれるので、抱っこやキャリーで長く歩かせる必要がありません。"),'
          assert old in s
          s = s.replace(old, new, 1)

          old = '("横浜・川崎から都内への移動も", "神奈川から東京の専門病院や二次診療の動物病院へ通う方も多くいます。お迎えに来られる会社と料金の目安がフォームに出るので、その中から1社を選んで予約を依頼します。"),'
          new = '("川崎・横浜から都内への移動も", "神奈川から東京の専門病院や二次診療の動物病院へ通う方も多くいます。お迎えに来られる会社と料金の目安がフォームに出るので、その中から1社を選んで予約を依頼します。"),'
          assert old in s
          s = s.replace(old, new, 1)

          marker = '   ("横浜から都内の動物病院まで頼めますか？", f"はい。県をまたぐ移動にも対応しています。横浜から都内までの20〜30kmなら、20kmで{fare_text(20)}、30kmで{fare_text(30)}が片道の目安です。"),\n'
          addition = marker + '   ("川崎市からでもペットタクシーを予約できますか？", "はい。川崎市からのお迎えもお申し込みを受け付けています。場所・日時・ペットの大きさなどの条件に合う事業者と料金の目安を表示し、その中からお願いしたい1社を選んで予約を依頼できます。"),\n'
          assert marker in s
          s = s.replace(marker, addition, 1)

          old = '<h1><small>犬のタクシー・猫のタクシー</small><span style="white-space:nowrap">{e(a["short"])}の</span><span style="white-space:nowrap">ペットタクシー。</span><br>手配料0円で予約。</h1>'
          new = '<h1><small>犬のタクシー・猫のタクシー</small><span style="white-space:nowrap">{e(a.get("h1", a["short"]))}の</span><span style="white-space:nowrap">ペットタクシー。</span><br>手配料0円で予約。</h1>'
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Regenerate area pages
        run: python3 tools/gen_areas.py .
      - name: Verify targeted output
        run: |
          python3 -m py_compile tools/gen_areas.py
          grep -q '神奈川・横浜・川崎の.*ペットタクシー' kanagawa/index.html
          grep -q '川崎市からでもペットタクシーを予約できますか？' kanagawa/index.html
      - name: Commit only expected files and remove this one-shot workflow
        run: |
          git config user.name 'ChatGPT SEO'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/seo-kanagawa-once.yml
          git add tools/gen_areas.py kanagawa/index.html
          git add -u .github/workflows/seo-kanagawa-once.yml
          git commit -m 'Search Console実績に合わせて神奈川・川崎SEOを改善'
          git push origin HEAD:chatgpt/seo-kanagawa-gsc
