# 一時の補助。/hosp.js と /find.js を上限に収めるため、共通の部品（tools/prefkeep.py）の空白を落とし、生成ファイルを作り直す。終わったら消す。
name: ai-trim-helper
on:
  push:
    branches: ['photo-ai-trim-1125']
    paths: ['.github/workflows/ai-trim-helper.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 愛知のトリミングの写真を入れる
        run: |
          pip install pillow
          cp tools/2-ai_trim_data.json tools/ai_trim_data.json
          python3 tools/1-ai_trim_apply.py
          ls img/fac/trimming | wc -l
      - name: 生成ファイルを作り直す
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
          wc -c hosp.js find.js
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/1-ai_trim_apply.py tools/2-ai_trim_data.json tools/ai_trim_data.json
          git add -A
          git reset -q .github/workflows/ai-trim-helper.yml
          git commit -qm "愛知のトリミングに公式サイトの写真を追加"
          git push
