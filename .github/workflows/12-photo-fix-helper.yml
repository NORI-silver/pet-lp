# 一時の補助。全国ページの写真の並びを ga.js が作るようにして、生成ファイルを作り直す。終わったら消す。
name: photo-fix-helper
on:
  push:
    branches: ['photo-b2-1125']
    paths: ['.github/workflows/photo-fix-helper.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 差し替え
        run: |
          cp tools/10-cardphoto_new.py tools/cardphoto.py
          cp tools/11-ga_new.js ga.js
          pip install pillow
      - name: 生成ファイルを作り直す
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/10-cardphoto_new.py tools/11-ga_new.js
          git add -A
          git reset -q .github/workflows/photo-fix-helper.yml
          git commit -qm "全国ページは1枚目だけ HTML、残りは ga.js（サイズ上限のため）"
          git push
