# カードの写真の枠をそろえる作業用。この作業ブランチだけで動く（main には何も書かない・公開しない）。本番に入れる前に消す。
name: photo-card-uniform
on:
  push:
    branches: ['NORI-silver-patch-1']
    paths: ['tools/cardphoto.py', 'tools/hosp_find.js', '.github/workflows/photo-card-uniform.yml']
permissions:
  contents: write
concurrency:
  group: photo-card-uniform
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - run: python3 tools/gen_areas.py .
      - name: cp-css を持つページの写真の枠を今の部品で入れなおす
        run: python3 tools/regen_cards.py
      - name: 作りなおしをもう1回やって同じか
        run: |
          git add -A
          python3 tools/gen_areas.py .
          python3 tools/regen_cards.py
          rm -rf tools/__pycache__
          git diff --stat --exit-code
      - run: python3 tools/rules_check.py .
      - run: wc -c hosp.js
      - name: このブランチに入れる
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "カードの写真の枠をそろえて、余白を写真になじませる（作りなおし）" || { echo "変更なし"; exit 0; }
          git push origin HEAD:${GITHUB_REF_NAME}
