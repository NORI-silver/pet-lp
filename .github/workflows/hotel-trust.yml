# ペットホテルの「安心して預けられるか」の材料（動物取扱業の登録・夜のスタッフ・様子の報告・見学など）を、各ホテルの公式サイトから集める。
# tools/hotel_trust_harvest.py が公式サイトを読み、ことばのまわりの文をブランチ hotel-trust-cand に置く（何も送らない・サイトは書き換えない）。
# 採るかどうかは人が文を読んで決め、tools/hotels.json の trust に入れる。
name: hotel-trust
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'registry だけ（公式サイトは読まない）なら registry'
        type: string
        default: ''
  push:
    branches: ['claude/**']
    paths: ['tools/hotel_trust_harvest.py', 'tools/hotel_registry.py', 'tools/hotel_registries.json', '.github/workflows/hotel-trust.yml']
permissions:
  contents: write
concurrency:
  group: hotel-trust
  cancel-in-progress: true
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl pdfplumber xlrd
      - name: 前の結果を残す
        run: |
          mkdir -p out
          git fetch -q origin hotel-trust-cand && git show origin/hotel-trust-cand:hotel_trust.json > out/hotel_trust.json && git show origin/hotel-trust-cand:hotel_trust.md > out/hotel_trust.md || true
      - name: 公式サイトを読む
        if: ${{ !contains(github.event.head_commit.message, '[registry]') && inputs.only != 'registry' }}
        run: |
          python3 tools/hotel_trust_harvest.py out
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: 自治体の一覧と照らし合わせる
        continue-on-error: true
        run: python3 tools/hotel_registry.py out
      - name: 候補をブランチ hotel-trust-cand に置く
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv out /tmp/out
          git checkout -q --orphan hotel-trust-cand
          git rm -rq --cached . && git clean -fdq
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "ペットホテルの信頼の材料の候補"
          git push -q -f origin hotel-trust-cand
