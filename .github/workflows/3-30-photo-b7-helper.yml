# 一時の補助。神奈川・千葉のドッグトレーナーの写真を入れて、生成ファイルを作り直す。終わったら消す。
name: photo-fx-helper
on:
  push:
    branches: ['photo-b7']
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 写真を入れる
        run: |
          pip install pillow
          ls tools | grep -E 'b7apply|b7data'
          cp tools/*b7apply.py /tmp/b7apply.py
          python3 /tmp/b7apply.py
      - name: 生成ファイルを作り直す
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
          node -e "const z=require('zlib'),f=require('fs');const n=z.gzipSync(f.readFileSync('dog-trainer/index.html'),{level:9}).length;console.log('national gz9',n);if(n>61440){console.error('over limit');process.exit(1)}"
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/*b7apply.py tools/*b7data.json
          git add -A
          git reset -q -- .github/workflows
          git commit -qm "神奈川・千葉のドッグトレーナーの写真を追加（公式サイトの写真、42事業者）"
          git push
