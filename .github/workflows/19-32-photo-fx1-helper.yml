# 一時の補助。老犬ホームの「要確認」を断った印にしない修正のあと作り直す（確認用の branch だけ）。終わったら消す。
name: photo-fx1-helper
on:
  push:
    branches: ['photo-fx1']
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 前の状態
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin; git merge origin/main -X theirs --no-edit -m "main を取り込む" || true
          mv tools/*30-faccard.py tools/faccard.py
          mv tools/*31-rojin-only-unknown.test.cjs tests/rojin-only-unknown.test.cjs
          git log -1 --format='base %H'
          echo "BEFORE rojin cards with o:1 + 要確認 fit:"; grep -rhoE "data-fid=\"R-B14-00[0-9]\"[^>]*data-fit='[^']*'[^>]*data-no=\"[^\"]*\"" rojin-home | sed 's/data-pics=.[^ ]*//' | sort -u | head -20
          echo "BEFORE R054:"; grep -rhoE "data-fid=\"R054\"[^>]*>" rojin-home | sort -u | cut -c1-300
          git diff --stat | tail -3
      - name: 作り直し2回
        run: |
          pip install pillow
          python3 tools/gen_areas.py . > /tmp/gen1.log 2>&1 || { tail -20 /tmp/gen1.log; exit 1; }
          rm -rf tools/__pycache__
          cp tools/lastmod.json /tmp/lm1.json
          python3 tools/gen_areas.py . > /tmp/gen2.log 2>&1 || { tail -20 /tmp/gen2.log; exit 1; }
          rm -rf tools/__pycache__
          echo "2nd regen vs 1st lastmod diff lines: $(diff /tmp/lm1.json tools/lastmod.json | wc -l)"
          echo "changed files: $(git status --porcelain | wc -l)"
          git status --porcelain | awk '{print $1" "$2}' | head -40
          echo "AFTER:"; grep -rhoE "data-fid=\"(R-B14-00[0-9]|R054)\"[^>]*>" rojin-home | sed -E "s/data-pics='[^']*'//" | sort -u | cut -c1-400
          for p in $(git status --porcelain | awk '{print $2}' | grep -E 'index.html$'); do echo "gz $p $(gzip -9c $p | wc -c)"; done | sort -k3 -n -r | head -5
      - name: 検査（SEO・決まり・台帳・食い違い）
        run: |
          python3 tools/seo_check.py . || echo SEO_FAILED
          python3 tools/rules_check.py . | tail -2
          python3 tools/feedback_check.py . | tail -1
          python3 tools/consistency_check.py . | tail -1
      - name: テスト
        run: for f in tests/*.test.cjs; do echo "== $f"; node "$f" || exit 1; done
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .github/workflows
          git commit -qm "老犬ホーム：「ほかの動物は要確認」を、ほかの動物を断っている印にしない"
          git push
