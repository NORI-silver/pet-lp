# 一時の補助。小規模県のドッグトレーナーの写真を入れて、生成ファイルを作り直す。終わったら消す。
name: photo-b6-helper
on:
  push:
    branches: ['photo-b6d-1125']
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 写真を入れる
        run: |
          pip install pillow
          ls tools | grep -E 'b6apply|b6data'
          cp tools/*b6apply.py /tmp/b6apply.py
          python3 /tmp/b6apply.py
      - name: 生成ファイルを作り直す
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/*b6apply.py tools/*b6data.json
          git add -A
          git reset -q -- .github/workflows
          git commit -qm "小規模県のドッグトレーナーの写真（公式サイトの写真）"
          git push
