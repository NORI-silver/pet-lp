# 一時の補助。小規模県のドッグトレーナーの写真を入れて、一覧の絞り込み属性の容量を減らし、生成ファイルを作り直す。終わったら消す。
name: photo-fx-helper
on:
  push:
    branches: ['photo-b8b']
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: アップロード時の番号を外し、容量の差分を当てる
        run: |
          mv tools/[0-9]-b8data.json tools/b8data.json
          mv tools/[0-9]-cap.patch /tmp/cap.patch
          git apply --check /tmp/cap.patch
          git apply /tmp/cap.patch
          git status --short | head
      - name: 写真を入れる
        run: |
          pip install pillow
          cp tools/*b8apply.py /tmp/b8apply.py
          python3 /tmp/b8apply.py
      - name: 生成ファイルを作り直す
        run: |
          python3 tools/faccard.py --quote-only
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
          node -e "const z=require('zlib'),f=require('fs');const n=z.gzipSync(f.readFileSync('dog-trainer/index.html'),{level:9}).length;console.log('national gz9',n);if(n>61440){console.error('over limit');process.exit(1)}"
      - name: テスト（リポジトリのSEO確認と同じ回し方。失敗したら止める）
        run: for f in tests/*.test.cjs; do echo "== $f"; node "$f" || exit 1; done
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/*b8apply.py tools/*b8data.json
          git add -A
          git reset -q -- .github/workflows
          git commit -qm "小規模県のドッグトレーナーの写真を追加（公式サイトの写真、79事業者）と、一覧の絞り込み属性の容量を減らす"
          git push
