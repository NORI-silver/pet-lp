# 選んだ写真の取りなおしとページの作りなおし。この作業ブランチだけで動く（main には何も書かない・公開しない）。
# tools/curated_trimming_chiba.json にある URL の写真だけを取り、縦横比の枠でページを作りなおして、同じブランチに入れる。
name: photo-curated-trimming
on:
  push:
    branches: ['instinct/photos-trimming-chiba']
    paths: ['tools/curated_trimming_chiba.json']
permissions:
  contents: write
concurrency:
  group: photo-curated-trimming
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: python3 tools/fetch_curated.py tools/curated_trimming_chiba.json
      - run: python3 tools/regen_cards.py
      - run: python3 tools/rules_check.py
      - name: このブランチに入れる
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img/fac/trimming
          git add -A -- '*.html'
          git commit -qm "写真と、写真の枠のページを作りなおし（photo-curated）" || { echo "変更なし"; exit 0; }
          git push origin HEAD:${GITHUB_REF_NAME}
