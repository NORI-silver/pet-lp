# 一時の補助。ペットホテルの写真を入れるための容量の証明（data-flags を外しても中身が変わらないこと）。終わったら消す。
name: photo-hp5-helper
on:
  push:
    branches: ["photo-hp4"]
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 番号を外す
        run: |
          mv tools/[0-9]*-hp-uikit.patch /tmp/hp.patch
          mv tools/[0-9]*-c1data.json tools/c1data.json
          cp tools/[0-9]*-c1apply.py /tmp/c1apply.py
          rm -f tools/[0-9]*-c1apply.py
          pip install pillow
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin; git merge origin/main -X theirs --no-edit -m 'main を取り込む' || true
          git log -1 --format='base %H'
          python3 - <<'PY'
          s=open('/tmp/c1apply.py').read()
          s=s.replace("D=json.load(open(glob.glob('tools/c1data.json')[0]))","D=json.load(open(glob.glob('tools/c1data.json')[0]))\nEXCL=set(x for x in os.environ.get('EXCL','').split(',') if x)\nD=[d for d in D if d['id'] not in EXCL]\nprint('excluded',len(EXCL))")
          open('/tmp/c1apply.py','w').write(s)
          PY
      - name: 基準（今のmainのまま作り直して、変わらないこと）
        run: |
          python3 tools/gen_areas.py . > /tmp/gen0.log 2>&1 || { tail -20 /tmp/gen0.log; exit 1; }
          rm -rf tools/__pycache__
          echo "changed files after baseline regen (excluding inputs): $(git status --porcelain | grep -v 'tools/c1data.json' | wc -l)"
          git status --porcelain | grep -v 'tools/c1data.json' | head -5
          mkdir -p /tmp/base && find . -name index.html -not -path './.git/*' -not -path './node_modules/*' | while read f; do mkdir -p "/tmp/base/$(dirname "$f")"; cp "$f" "/tmp/base/$f"; done
          echo "base pages: $(find /tmp/base -name index.html | wc -l)"
      - name: data-flags を外すパッチを当てて、外した以外は1文字も変わらないことを確かめる
        run: |
          git apply --check /tmp/hp.patch
          git apply /tmp/hp.patch
          python3 tools/gen_areas.py . > /tmp/gen1.log 2>&1 || { tail -20 /tmp/gen1.log; exit 1; }
          rm -rf tools/__pycache__
          cat > /tmp/cmp.py <<'PY'
          import os,re,sys
          a_root,b_root,strip=sys.argv[1],sys.argv[2],sys.argv[3]=="strip"
          pat=re.compile(r' data-flags="[^"]*"')
          n=diff=flags=0;ex=[]
          for r,_,fs in os.walk(b_root):
              if '.git' in r.split(os.sep) or 'node_modules' in r.split(os.sep): continue
              if 'index.html' not in fs: continue
              p=os.path.join(r,'index.html');rel=os.path.relpath(p,b_root)
              q=os.path.join(a_root,rel)
              if not os.path.exists(q): diff+=1;ex.append(('missing',rel));continue
              A=open(q,encoding='utf8').read();B=open(p,encoding='utf8').read()
              if strip:
                  A2=pat.sub('',A) if rel.startswith('pet-hotel') else A
                  B=pat.sub('',B) if rel.startswith('pet-hotel') else B
                  A=A2
              n+=1
              if A!=B:
                  diff+=1
                  if len(ex)<5: ex.append(rel)
              if rel.startswith('pet-hotel'): flags+=B.count('data-flags=')
          print('pages compared',n,'different',diff,'data-flags left in pet-hotel pages',flags,ex)
          sys.exit(1 if diff else 0)
          PY
          python3 /tmp/cmp.py /tmp/base . strip
          mkdir -p /tmp/p1 && find . -name index.html -not -path './.git/*' -not -path './node_modules/*' | while read f; do mkdir -p "/tmp/p1/$(dirname "$f")"; cp "$f" "/tmp/p1/$f"; done
      - name: もう一度作り直して、同じになること（作り直しの冪等性）
        run: |
          python3 tools/gen_areas.py . > /tmp/gen2.log 2>&1 || { tail -20 /tmp/gen2.log; exit 1; }
          rm -rf tools/__pycache__
          python3 /tmp/cmp.py /tmp/p1 . nostrip
      - name: 容量（写真を入れる前）
        run: |
          node -e "const z=require('zlib'),f=require('fs');for(const p of ['pet-hotel','trimming','dog-trainer']){console.log(p,z.gzipSync(f.readFileSync(p+'/index.html'),{level:9}).length)}"
      - name: 写真を入れて容量を測る（全部入れた場合）
        run: |
          python3 /tmp/c1apply.py | tee /tmp/apply.log
          python3 tools/gen_areas.py . > /tmp/gen3.log 2>&1 || { tail -20 /tmp/gen3.log; exit 1; }
          rm -rf tools/__pycache__
          cat > /tmp/sel.py <<'PY'
          import re,gzip,json
          A=open('/tmp/p1/pet-hotel/index.html',encoding='utf8').read();N=open('pet-hotel/index.html',encoding='utf8').read()
          def cards(h):
              ms=list(re.finditer(r'<(\w+)[^>]*data-fid="([^"]*)"',h));d={}
              for i,m in enumerate(ms):
                  d[m.group(2)]=(m.start(),ms[i+1].start() if i+1<len(ms) else len(h))
              return d
          ca,cn=cards(A),cards(N)
          g=lambda t:len(gzip.compress(t.encode(),9))
          base=g(N);print('full gz',base,'before photos',g(A))
          ch=[f for f in cn if f in ca and A[ca[f][0]:ca[f][1]]!=N[cn[f][0]:cn[f][1]]]
          res=[]
          for f in ch:
              s,e=cn[f];M=N[:s]+A[ca[f][0]:ca[f][1]]+N[e:]
              res.append((base-g(M),f))
          res.sort(reverse=True)
          print('changed cards',len(ch),'top',res[:12])
          TARGET=61440-300;ex=[];cur=base
          cur_t=base
          M=N;
          for d,f in res:
              if cur<=TARGET: break
              s,e=cn[f]
              ex.append(f)
              # 再計算（一括で戻して測る）
              parts=[];last=0
              for ff in sorted(ex,key=lambda x:cn[x][0]):
                  s,e=cn[ff];parts.append(N[last:s]);parts.append(A[ca[ff][0]:ca[ff][1]]);last=e
              parts.append(N[last:]);cur=g(''.join(parts))
          print('EXCLUDE',len(ex),'est gz',cur,'ids',','.join(ex))
          open('/tmp/excl.txt','w').write(','.join(ex))
          PY
          python3 /tmp/sel.py | tee /tmp/sel.log
      - name: 外す分を除いて入れ直す
        run: |
          git checkout -q -- .
          git clean -fdq img
          rm -f tools/[0-9]*-hp-uikit.patch tools/[0-9]*-c1apply.py tools/[0-9]*-c1data.json
          git apply /tmp/hp.patch
          EXCL=$(cat /tmp/excl.txt) python3 /tmp/c1apply.py | tee /tmp/apply2.log
          python3 tools/gen_areas.py . > /tmp/gen4.log 2>&1 || { tail -20 /tmp/gen4.log; exit 1; }
          rm -rf tools/__pycache__
          cp tools/lastmod.json /tmp/lm1.json
          python3 tools/gen_areas.py . > /tmp/gen5.log 2>&1 || { tail -20 /tmp/gen5.log; exit 1; }
          rm -rf tools/__pycache__
          echo "2nd regen lastmod diff lines: $(diff /tmp/lm1.json tools/lastmod.json | wc -l)"
          node -e "const z=require('zlib'),f=require('fs');for(const p of ['pet-hotel','trimming','dog-trainer']){console.log('FINAL gz',p,z.gzipSync(f.readFileSync(p+'/index.html'),{level:9}).length)}"
          echo "changed files: $(git status --porcelain | wc -l)"
      - name: 絞り込みの証明
        run: |
          cat > /tmp/filt.py <<'PY'
          import re,collections,sys
          def cards(p):
              h=open(p,encoding='utf8').read()
              d={}
              for m in re.finditer(r'<div class="emg-item[^>]*>',h):
                  t=m.group(0)
                  fid=re.search(r'data-fid="([^"]*)"',t)
                  if not fid: continue
                  g=lambda a:(re.search(r' '+a+r'="([^"]*)"',t) or [0,None])[1]
                  d[fid.group(1)]=dict(k=g('data-k'),no=g('data-no'),ft=g('data-ft'),fit=g('data-fit'),cat=g('data-cat'),flags=g('data-flags'),ffi=' data-ffi' in t)
              return d
          for page in ['pet-hotel/index.html']:
              A=cards('/tmp/base/'+page); B=cards(page)
              print('FILTER PROOF',page,'cards before',len(A),'after',len(B),'same id set',set(A)==set(B))
              for a in ['k','no','ft','fit','cat','ffi']:
                  print('  attr',a,'changed cards:',sum(1 for i in A if i in B and A[i][a]!=B[i][a]))
              print('  data-flags before',sum(1 for v in A.values() if v['flags'] is not None),'after',sum(1 for v in B.values() if v['flags'] is not None))
              for a in ['k','no','ft']:
                  ca=collections.Counter(x for v in A.values() for x in (v[a] or '').split())
                  cb=collections.Counter(x for v in B.values() for x in (v[a] or '').split())
                  print('  tokens',a,'before',dict(sorted(ca.items())),'after',dict(sorted(cb.items())))
              pa=sum(1 for v in A.values() if v['ffi']); print('  cards with data-ffi',pa,sum(1 for v in B.values() if v['ffi']))
          PY
          python3 /tmp/filt.py
      - name: 検査
        run: |
          python3 tools/seo_check.py . || echo SEO_FAILED
          python3 tools/rules_check.py . | tail -2
          python3 tools/feedback_check.py . | tail -1
          python3 tools/consistency_check.py . | tail -1
      - name: テスト
        run: for f in tests/*.test.cjs; do echo "== $f"; node "$f" || exit 1; done
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/c1data.json
          git add -A
          git reset -q -- .github/workflows
          git commit -qm "ペットホテルの写真を追加（公式サイトの写真）と、カードの data-flags の重複書きをやめる"
          git push
