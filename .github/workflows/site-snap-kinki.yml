# 近畿（三重・滋賀・京都・大阪・兵庫・奈良・和歌山）の網羅用。site-snap と同じしくみで、queue・reg は tools/crawl/kinki/、結果はブランチ crawl-out-kinki。
# 何も送らない・サイトは書き換えない。
name: site-snap-kinki
on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-q4p8u2']
    paths: ['tools/crawl/kinki/**', 'tools/crawl_kinki.py']
permissions:
  contents: write
concurrency:
  group: site-snap-kinki
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 読む
        run: python3 tools/crawl_kinki.py /tmp/out
      - name: 結果をブランチ crawl-out-kinki に置く
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan crawl-out-kinki
          git rm -rq --cached . && git clean -fdq
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "近畿の抜き出し ${GITHUB_SHA::7}"
          git push -q -f origin crawl-out-kinki
