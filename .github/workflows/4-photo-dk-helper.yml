# 一時の補助。カードの data-k の二重書きをやめて、生成ファイルを作り直す。終わったら消す。
name: dk-helper
on:
  push:
    branches: ['dk-dedupe-1125']
    paths: ['.github/workflows/dk-helper.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 前の条件を記録
        run: |
          cp tools/*keysnap.py /tmp/keysnap.py
          python3 /tmp/keysnap.py . /tmp/before.json
          node -e "const z=require('zlib'),f=require('fs');console.log('national gz before',z.gzipSync(f.readFileSync('dog-trainer/index.html'),{level:9}).length)"
      - name: 直して作り直す
        run: |
          cp tools/*dkpatch.py /tmp/dkpatch.py
          python3 /tmp/dkpatch.py
          cp tools/*filter-key-dedupe.test.cjs tests/filter-key-dedupe.test.cjs
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
      - name: 全カードで同じか確かめる
        run: |
          python3 /tmp/keysnap.py . /tmp/after.json
          python3 - <<'PY'
          import json
          b = json.load(open('/tmp/before.json')); a = json.load(open('/tmp/after.json'))
          assert set(a) == set(b), ('card set differs', len(a), len(b))
          bad = [k for k in b if a[k] != b[k]]
          print('cards', len(b), 'mismatch', len(bad))
          assert not bad, bad[:5]
          PY
          node -e "const z=require('zlib'),f=require('fs');const n=z.gzipSync(f.readFileSync('dog-trainer/index.html'),{level:9}).length;console.log('national gz after',n);if(n>61440)process.exit(1)"
          node tests/filter-key-dedupe.test.cjs
          for t in tests/*.test.cjs; do node $t > /dev/null || { echo FAIL $t; exit 1; }; done
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/*keysnap.py tools/*dkpatch.py tools/*filter-key-dedupe.test.cjs
          git add -A
          git reset -q .github/workflows/dk-helper.yml
          git commit -qm "カードの data-k の二重書きをやめる（条件は同じ・容量だけ減る）"
          git push
