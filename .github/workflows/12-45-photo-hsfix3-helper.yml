# 一時の補助。動物病院46院を足して作り直す（確認用の branch だけ）。終わったら消す。
name: photo-hsfix3-helper
on:
  push:
    branches: ['NORI-silver-patch-2']
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 足す
        run: |
          pip install pillow
          git log -1 --format='base %H'
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/main --no-edit -m "main を取り込む" || true
          git diff --name-only --diff-filter=U
          test "$(git diff --name-only --diff-filter=U)" = "tools/vet_clinics.json"
          # main は並び替えだけ（中身は同じ）。main の並びに、こちらの追加188院と訂正2件を載せる
          python3 - <<'PY'
          import json,subprocess
          def st(n): return json.loads(subprocess.check_output(['git','show',f':{n}:tools/vet_clinics.json']).decode())
          b,o,t=st(1),st(2),st(3)
          B={c['id']:c for c in b['clinics']};O={c['id']:c for c in o['clinics']};T={c['id']:c for c in t['clinics']}
          print(len(B),len(O),len(T))
          out=dict(t);res=[]
          conf=[]
          for c in t['clinics']:
              i=c['id']
              if i in O and i in B and O[i]!=B[i]:
                  if T[i]!=B[i] and T[i]!=O[i]: conf.append(i)
                  res.append(O[i])
              else: res.append(c)
          new=[c for c in o['clinics'] if c['id'] not in T]
          print('new',len(new),'modified',sum(1 for i in O if i in B and O[i]!=B[i]),'main-changed',sum(1 for i in T if i in B and T[i]!=B[i]),'main-added',len([i for i in T if i not in B]),'conf',conf,'ours-only-deleted',len([i for i in B if i not in O]),'main-deleted',len([i for i in B if i not in T]))
          out['clinics']=res+new
          if 'note' in o and o['note']!=t.get('note'): print('note differs')
          json.dump(out,open('tools/vet_clinics.json','w',encoding='utf-8'),ensure_ascii=False,indent=1)
          print(len(out['clinics']))
          PY
          git add tools/vet_clinics.json
          git rm -rq hospital/tokyo/koto-ku || true
          git rm -q .github/workflows/11-44-photo-hsfix2-helper.yml || true
      - name: 作り直し2回
        run: |
          python3 tools/gen_areas.py . > /tmp/gen1.log 2>&1 || { tail -20 /tmp/gen1.log; exit 1; }
          rm -rf tools/__pycache__
          cp tools/lastmod.json /tmp/lm1.json
          python3 tools/gen_areas.py . > /tmp/gen2.log 2>&1 || { tail -20 /tmp/gen2.log; exit 1; }
          rm -rf tools/__pycache__
          echo "2nd regen vs 1st lastmod diff lines: $(diff /tmp/lm1.json tools/lastmod.json | wc -l)"
          echo "changed files: $(git status --porcelain | wc -l)"
          git status --porcelain | awk '{print $2}' | awk -F/ '{print $1"/"$2}' | sort | uniq -c | sort -rn | head -30
          echo "gz: hospital $(gzip -9c hospital/index.html | wc -c)"
          for p in $(git status --porcelain | awk '{print $2}' | grep -E '^hospital/.*index.html$'); do echo "gz $p $(gzip -9c $p | wc -c)"; done | sort -k3 -n -r | head -8
      - name: 新しい病院の判定（hospital/data の中身）
        run: |
          python3 - <<'PY'
          import json,glob
          new=json.load(open('tools/vet_clinics.json',encoding='utf-8'))['clinics'][-188:]
          names={(c['name']) for c in new}
          print('new records',len(new),'unique ids',len({c['id'] for c in new}))
          seen=0
          for f in sorted(glob.glob('hospital/data/*.json')):
              for r in json.load(open(f,encoding='utf-8')):
                  if r.get('n') in names:
                      seen+=1; print(f.split('/')[-1],r['n'],'|a:',r.get('a'),'|y:',','.join(r.get('y',[])),'|no:',','.join(r.get('no',[])),'|pg:',r.get('pg'),'|tel' if r.get('tel') else '')
          print('seen in hospital/data',seen)
          PY
      - name: 検査（SEO・決まり・台帳・食い違い）
        run: |
          (python3 tools/seo_check.py . || echo SEO_FAILED; python3 tools/rules_check.py . | tail -2; python3 tools/feedback_check.py . | tail -1; python3 tools/consistency_check.py . | tail -1) 2>&1 | tee /tmp/gates.log
      - name: テスト
        run: |
          rm -f /tmp/tf
          for f in tests/*.test.cjs; do echo "== $f"; node "$f" > /tmp/one.log 2>&1 || { echo "FAILED $f"; tail -40 /tmp/one.log; touch /tmp/tf; }; done 2>&1 | tee /tmp/tests.log
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/gates.log tools/_gates.txt; cp /tmp/tests.log tools/_tests.txt
          git add -A
          git reset -q -- .github/workflows
          if [ -f /tmp/tf ]; then
            git commit -qm "DIAG: tests failed (not for merge)"
            git push -f origin HEAD:refs/heads/diag-hs151
          else
            git rm -q --cached tools/_gates.txt tools/_tests.txt; rm -f tools/_gates.txt tools/_tests.txt
            git commit -qm "江東区の薄い市区ページの残りを消す（病院の追加は188院のまま）"
            git push
          fi
