# SNS 4週間の試験運用: Threads 毎日8時、Instagram 月水金19時 (JST)
# GitHub Actions のスケジュールには実行遅延があり、時刻は目安。
# 投稿の停止フラグ meta_pause がある間は自動公開しない。
name: sns-meta
on:
  schedule:
    - cron: '0 23 * * *' # JST 翌日08:00 Threads
    - cron: '0 10 * * 1,3,5' # JST 月水金19:00 Instagram
  workflow_dispatch:
    inputs:
      dry:
        description: '出さずに、次に出す文を見るだけ'
        type: boolean
        default: true
      check:
        description: 'キーが使えるかだけ確かめる（出さない）'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sns-meta
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Threads（毎日朝）
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 23 * * *'
        env:
          META_THREADS_TOKEN: ${{ secrets.META_THREADS_TOKEN }}
        run: python3 sns/post_meta.py --only threads ${{ inputs.dry && '--dry' || '' }} ${{ inputs.check && '--check' || '' }}
      - name: Instagram（月水金夜）
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 1,3,5'
        env:
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
        run: python3 sns/post_meta.py --only ig ${{ inputs.dry && '--dry' || '' }} ${{ inputs.check && '--check' || '' }}
      - name: 記録をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sns/state.json
          git diff --cached --quiet || { git commit -q -m "Instagram・Threadsの投稿を記録"; git pull --rebase -q; git push; }
