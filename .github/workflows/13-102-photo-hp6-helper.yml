# 一時の補助。ペットホテルの写真を入れるための容量の証明（data-flags を外しても中身が変わらないこと）。終わったら消す。
name: photo-hp6-helper
on:
  push:
    branches: ["photo-hp4"]
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 番号を外す
        run: |
          mv tools/[0-9]*-hp-uikit.patch /tmp/hp.patch
          mv tools/[0-9]*-c1data.json tools/c1data.json
          cp tools/[0-9]*-c1apply.py /tmp/c1apply.py
          rm -f tools/[0-9]*-c1apply.py
          pip install pillow
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin; git merge origin/main -X theirs --no-edit -m 'main を取り込む' || true
          git log -1 --format='base %H'
          python3 - <<'PY'
          s=open('/tmp/c1apply.py').read()
          s=s.replace("D=json.load(open(glob.glob('tools/c1data.json')[0]))","D=json.load(open(glob.glob('tools/c1data.json')[0]))\nEXCL=set(x for x in os.environ.get('EXCL','').split(',') if x)\nD=[d for d in D if d['id'] not in EXCL]\nprint('excluded',len(EXCL))")
          open('/tmp/c1apply.py','w').write(s)
          PY
      - name: 基準を控える（いまの main のまま）
        run: |
          mkdir -p /tmp/base && find . -name index.html -not -path './.git/*' -not -path './node_modules/*' | while read f; do mkdir -p "/tmp/base/$(dirname "$f")"; cp "$f" "/tmp/base/$f"; done
          echo "base pages: $(find /tmp/base -name index.html | wc -l)"
          node -e "const z=require('zlib'),f=require('fs');for(const p of ['pet-hotel','trimming','dog-trainer']){console.log('BASE gz',p,z.gzipSync(f.readFileSync(p+'/index.html'),{level:9}).length)}"
      - name: data-flags を外すパッチ（2回作り直して落ち着かせる）
        run: |
          git apply --check /tmp/hp.patch
          git apply /tmp/hp.patch
          for i in 1 2; do python3 tools/gen_areas.py . > /tmp/gen$i.log 2>&1 || { tail -20 /tmp/gen$i.log; exit 1; }; rm -rf tools/__pycache__; cp tools/lastmod.json /tmp/lm$i.json; done
          echo "patch regen 2nd vs 1st lastmod diff lines: $(diff /tmp/lm1.json /tmp/lm2.json | wc -l)"
          cat > /tmp/cmp.py <<'PY'
          import os,re,sys
          a_root,b_root=sys.argv[1],sys.argv[2]
          pat=re.compile(r' data-flags="[^"]*"')
          n=diff=0;ex=[]
          for r,_,fs in os.walk(b_root):
              if '.git' in r.split(os.sep) or 'node_modules' in r.split(os.sep): continue
              if 'index.html' not in fs: continue
              p=os.path.join(r,'index.html');rel=os.path.relpath(p,b_root);q=os.path.join(a_root,rel)
              if not os.path.exists(q): diff+=1;ex.append(('missing',rel));continue
              A=open(q,encoding='utf8').read();B=open(p,encoding='utf8').read()
              if rel.startswith('pet-hotel'): A=pat.sub('',A);B=pat.sub('',B)
              n+=1
              if A!=B:
                  diff+=1
                  if len(ex)<5: ex.append(rel)
          print('STRIP COMPARE pages compared',n,'different',diff,ex)
          PY
          python3 /tmp/cmp.py /tmp/base .
          mkdir -p /tmp/p1 && find . -name index.html -not -path './.git/*' -not -path './node_modules/*' | while read f; do mkdir -p "/tmp/p1/$(dirname "$f")"; cp "$f" "/tmp/p1/$f"; done
          node -e "const z=require('zlib'),f=require('fs');for(const p of ['pet-hotel','trimming','dog-trainer']){console.log('PATCHED gz',p,z.gzipSync(f.readFileSync(p+'/index.html'),{level:9}).length)}"
      - name: 写真を全部入れて、カードごとの容量を測る
        run: |
          python3 /tmp/c1apply.py | tee /tmp/apply.log
          for i in 1 2; do python3 tools/gen_areas.py . > /tmp/gen$i.log 2>&1 || { tail -20 /tmp/gen$i.log; exit 1; }; rm -rf tools/__pycache__; done
          cat > /tmp/sel.py <<'PY'
          import re,gzip
          A=open('/tmp/p1/pet-hotel/index.html',encoding='utf8').read();N=open('pet-hotel/index.html',encoding='utf8').read()
          def cards(h):
              ms=[m.start() for m in re.finditer(r'<div class="emg-item',h)];d={}
              for i,s in enumerate(ms):
                  e=ms[i+1] if i+1<len(ms) else len(h);t=h[s:e]
                  m=re.search(r'class="ux-c-n" href="([^"]*)"[^>]*><b>([^<]*)</b>',t)
                  d[(m.group(1),m.group(2)) if m else ('?',str(i))]=(s,e)
              return d
          ca,cn=cards(A),cards(N)
          print('cards before',len(ca),'after',len(cn),'same key set',set(ca)==set(cn))
          g=lambda t:len(gzip.compress(t.encode(),9))
          base=g(N);print('full gz',base,'patched-before-photos gz',g(A))
          PH=re.compile(r'<div class="cs-ph">.*?</small></div>',re.S)
          nophoto=lambda t:PH.sub('',t,count=1)
          ch=[k for k in cn if k in ca and '<div class="cs-ph">' in N[cn[k][0]:cn[k][1]] and '<div class="cs-ph">' not in A[ca[k][0]:ca[k][1]]]
          print('cards gaining a photo',len(ch))
          res=[]
          for k in ch:
              s,e=cn[k];res.append((base-g(N[:s]+nophoto(N[s:e])+N[e:]),k))
          res.sort(reverse=True);print('largest',[(b,k[1]) for b,k in res[:12]])
          TARGET=61440-300;ex=[];cur=base
          def build(exs):
              parts=[];last=0
              for k in sorted(exs,key=lambda x:cn[x][0]):
                  s,e=cn[k];parts.append(N[last:s]);parts.append(nophoto(N[s:e]));last=e
              parts.append(N[last:]);return ''.join(parts)
          for b,k in res:
              if cur<=TARGET: break
              ex.append(k);cur=g(build(ex))
          print('EXCLUDE cards',len(ex),'est gz',cur,[k[1] for k in ex])
          import json
          pid=re.compile(r'/img/fac/hotel/([A-Za-z0-9\-]+)_\d+\.webp')
          ids=[]
          for k in ex:
              s,e=cn[k];m=pid.search(N[s:e]);ids.append(m.group(1) if m else '?')
          print('EXCLUDE ids',ids)
          open('/tmp/excl.txt','w').write(','.join(ids))
          PY
          python3 /tmp/sel.py | tee /tmp/sel.log
          grep -q "EXCLUDE ids \['?'" /tmp/sel.log && echo UNKNOWN_ID || true
      - name: 外す分を除いて入れ直す
        run: |
          git checkout -q -- .
          git clean -fdq img
          rm -f tools/[0-9]*-hp-uikit.patch tools/[0-9]*-c1apply.py tools/[0-9]*-c1data.json
          git apply /tmp/hp.patch
          EXCL=$(cat /tmp/excl.txt) python3 /tmp/c1apply.py | tee /tmp/apply2.log
          for i in 1 2; do python3 tools/gen_areas.py . > /tmp/gen$i.log 2>&1 || { tail -20 /tmp/gen$i.log; exit 1; }; rm -rf tools/__pycache__; cp tools/lastmod.json /tmp/lm$i.json; done
          echo "final regen 2nd vs 1st lastmod diff lines: $(diff /tmp/lm1.json /tmp/lm2.json | wc -l)"
          node -e "const z=require('zlib'),f=require('fs');for(const p of ['pet-hotel','trimming','dog-trainer']){console.log('FINAL gz',p,z.gzipSync(f.readFileSync(p+'/index.html'),{level:9}).length)}"
          echo "changed files: $(git status --porcelain | wc -l)"
      - name: 絞り込みの証明（カードの鍵は リンク＋名前）
        run: |
          cat > /tmp/filt.py <<'PY'
          import re,collections
          def cards(p):
              h=open(p,encoding='utf8').read();ms=[m.start() for m in re.finditer(r'<div class="emg-item',h)];d={}
              for i,s in enumerate(ms):
                  t=h[s:(ms[i+1] if i+1<len(ms) else len(h))];tag=re.match(r'<div[^>]*>',t).group(0)
                  m=re.search(r'class="ux-c-n" href="([^"]*)"[^>]*><b>([^<]*)</b>',t)
                  k=(m.group(1),m.group(2)) if m else ('?',str(i))
                  g=lambda a:(re.search(r' '+a+r'=(?:"([^"]*)"|\'([^\']*)\')',tag) or [0,None,None])
                  gg=lambda a:(lambda x:x[1] or x[2])(g(a))
                  d[k]=dict(k=gg('data-k'),no=gg('data-no'),ft=gg('data-ft'),fit=gg('data-fit'),city=gg('data-city'),ffi=' data-ffi' in tag,flags=gg('data-flags'))
              return d
          for page in ['pet-hotel/index.html','trimming/index.html']:
              A=cards('/tmp/base/'+page);B=cards(page)
              print('FILTER PROOF',page,'cards before',len(A),'after',len(B),'same key set',set(A)==set(B))
              for a in ['k','no','ft','fit','city','ffi']:
                  print('  attr',a,'changed cards:',sum(1 for i in A if i in B and A[i][a]!=B[i][a]))
              print('  data-flags before',sum(1 for v in A.values() if v['flags'] is not None),'after',sum(1 for v in B.values() if v['flags'] is not None))
              for a in ['k','no','ft']:
                  ca=collections.Counter(x for v in A.values() for x in (v[a] or '').replace('|',' ').split())
                  cb=collections.Counter(x for v in B.values() for x in (v[a] or '').replace('|',' ').split())
                  print('  tokens',a,'diff',{x:(ca[x],cb[x]) for x in set(ca)|set(cb) if ca[x]!=cb[x]})
          PY
          python3 /tmp/filt.py
      - name: 検査
        run: |
          python3 tools/seo_check.py . || echo SEO_FAILED
          python3 tools/rules_check.py . | tail -2
          python3 tools/feedback_check.py . | tail -1
          python3 tools/consistency_check.py . | tail -1
      - name: テスト
        run: for f in tests/*.test.cjs; do echo "== $f"; node "$f" || exit 1; done
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/c1data.json
          git add -A
          git reset -q -- .github/workflows
          git commit -qm "ペットホテルの写真を追加（公式サイトの写真）と、カードの data-flags の重複書きをやめる"
          git push
