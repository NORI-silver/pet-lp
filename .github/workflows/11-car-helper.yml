# 一時の補助。写真が2枚以上のカードにドットと矢印を付け、生成ファイルを作り直す。終わったら消す。
name: car-helper
on:
  push:
    branches: ['carousel-hint-1125']
    paths: ['.github/workflows/car-helper.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 部品を直す
        run: |
          python3 tools/10-car_apply.py
          git diff --stat
      - name: 生成ファイルを作り直す
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
          wc -c hosp.js find.js ga.js
      - name: コミット
        run: |
          rm -f tools/10-car_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q .github/workflows/car-helper.yml
          git commit -qm "写真が2枚以上のカードに、ドットと左右の矢印を付ける（写真は全体のまま・切らない）"
          git push
