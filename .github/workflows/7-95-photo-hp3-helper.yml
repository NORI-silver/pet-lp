# 一時の補助。ペットホテルの写真を入れるための容量の証明（data-flags を外しても中身が変わらないこと）。終わったら消す。
name: photo-hp3-helper
on:
  push:
    branches: ["photo-hp3"]
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 番号を外す
        run: |
          mv tools/[0-9]*-hp-uikit.patch /tmp/hp.patch
          mv tools/[0-9]*-c1data.json tools/c1data.json
          cp tools/[0-9]*-c1apply.py /tmp/c1apply.py
          rm -f tools/[0-9]*-c1apply.py
          pip install pillow
      - name: 基準（今のmainのまま作り直して、変わらないこと）
        run: |
          python3 tools/gen_areas.py . > /tmp/gen0.log 2>&1 || { tail -20 /tmp/gen0.log; exit 1; }
          rm -rf tools/__pycache__
          echo "changed files after baseline regen (excluding inputs): $(git status --porcelain | grep -v 'tools/c1data.json' | wc -l)"
          git status --porcelain | grep -v 'tools/c1data.json' | head -5
          mkdir -p /tmp/base && find . -name index.html -not -path './.git/*' -not -path './node_modules/*' | while read f; do mkdir -p "/tmp/base/$(dirname "$f")"; cp "$f" "/tmp/base/$f"; done
          echo "base pages: $(find /tmp/base -name index.html | wc -l)"
      - name: data-flags を外すパッチを当てて、外した以外は1文字も変わらないことを確かめる
        run: |
          git apply --check /tmp/hp.patch
          git apply /tmp/hp.patch
          python3 tools/gen_areas.py . > /tmp/gen1.log 2>&1 || { tail -20 /tmp/gen1.log; exit 1; }
          rm -rf tools/__pycache__
          cat > /tmp/cmp.py <<'PY'
          import os,re,sys
          a_root,b_root,strip=sys.argv[1],sys.argv[2],sys.argv[3]=="strip"
          pat=re.compile(r' data-flags="[^"]*"')
          n=diff=flags=0;ex=[]
          for r,_,fs in os.walk(b_root):
              if '.git' in r.split(os.sep) or 'node_modules' in r.split(os.sep): continue
              if 'index.html' not in fs: continue
              p=os.path.join(r,'index.html');rel=os.path.relpath(p,b_root)
              q=os.path.join(a_root,rel)
              if not os.path.exists(q): diff+=1;ex.append(('missing',rel));continue
              A=open(q,encoding='utf8').read();B=open(p,encoding='utf8').read()
              if strip:
                  A2=pat.sub('',A) if rel.startswith('pet-hotel') else A
                  B=pat.sub('',B) if rel.startswith('pet-hotel') else B
                  A=A2
              n+=1
              if A!=B:
                  diff+=1
                  if len(ex)<5: ex.append(rel)
              if rel.startswith('pet-hotel'): flags+=B.count('data-flags=')
          print('pages compared',n,'different',diff,'data-flags left in pet-hotel pages',flags,ex)
          sys.exit(1 if diff else 0)
          PY
          python3 /tmp/cmp.py /tmp/base . strip
          mkdir -p /tmp/p1 && find . -name index.html -not -path './.git/*' -not -path './node_modules/*' | while read f; do mkdir -p "/tmp/p1/$(dirname "$f")"; cp "$f" "/tmp/p1/$f"; done
      - name: もう一度作り直して、同じになること（作り直しの冪等性）
        run: |
          python3 tools/gen_areas.py . > /tmp/gen2.log 2>&1 || { tail -20 /tmp/gen2.log; exit 1; }
          rm -rf tools/__pycache__
          python3 /tmp/cmp.py /tmp/p1 . nostrip
      - name: 容量（写真を入れる前）
        run: |
          node -e "const z=require('zlib'),f=require('fs');for(const p of ['pet-hotel','trimming','dog-trainer']){console.log(p,z.gzipSync(f.readFileSync(p+'/index.html'),{level:9}).length)}"
      - name: ペットホテルの写真を入れて作り直す
        run: |
          python3 /tmp/c1apply.py | tee /tmp/apply.log
          python3 tools/gen_areas.py . > /tmp/gen3.log 2>&1 || { tail -20 /tmp/gen3.log; exit 1; }
          rm -rf tools/__pycache__
          node -e "const z=require('zlib'),f=require('fs');for(const p of ['pet-hotel','trimming','dog-trainer']){console.log(p,z.gzipSync(f.readFileSync(p+'/index.html'),{level:9}).length)}"
      - name: テスト
        run: for f in tests/*.test.cjs; do echo "== $f"; node "$f" || exit 1; done
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/c1data.json
          git add -A
          git reset -q -- .github/workflows
          git commit -qm "ペットホテルの写真を追加（公式サイトの写真）と、カードの data-flags の重複書きをやめる"
          git push
