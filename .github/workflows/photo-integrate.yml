# 写真の積み重ね (#708 から #716) を、最新の main の上に1本のブランチとして作りなおす。main には何も書かない・公開しない。
name: photo-integrate
on:
  push:
    branches: ['instinct/photos-integrate-run']
    paths: ['tools/integrate_trigger.txt']
permissions:
  contents: write
concurrency:
  group: photo-integrate
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow
      - name: main を取りこむ（ページは main 側を取り、あとで作りなおす）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main -X theirs --no-edit -m "最新の main を取りこむ（写真の積み重ね用）"
      - run: python3 tools/fill_ratio.py
      - run: python3 tools/regen_cards.py
      - run: python3 tools/taxi_render_patch.py
      - name: 病院カードの列で、隣のカードに合わせて背が伸びないようにする（余白をなくす）
        run: |
          python3 - <<'PYEOF'
          p = "tools/hosp_find.py"
          t = open(p, encoding="utf-8").read()
          old = ".hf-list{display:grid;gap:10px}"
          assert old in t, "hf-list css not found"
          open(p, "w", encoding="utf-8").write(t.replace(old, ".hf-list{display:grid;gap:10px;align-items:start}", 1))
          q = "tools/faccard.py"
          u = open(q, encoding="utf-8").read()
          o2 = ".fr-s{display:flex;align-items:stretch;"
          assert o2 in u, "fr-s css not found"
          open(q, "w", encoding="utf-8").write(u.replace(o2, ".fr-s{display:flex;align-items:flex-start;", 1))
          PYEOF
      - name: 生成ファイルを作りなおす（seo-check と同じ）
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
          git status --short | head -20
      - name: 写真の枠の形が変わったので、テストの書き方を合わせる（比率と contain の確認は残す）
        run: |
          python3 - <<'PYEOF'
          p = "tests/hirose-card.test.cjs"
          t = open(p, encoding="utf-8").read()
          old = r"""  assert.match(page, /\.cs-ph\[data-gph="T114"\]\{aspect-ratio:520\/347\}\.cs-ph\[data-gph="T114"\] img\{object-fit:contain\}/);"""
          new = r"""  assert.match(page, /\.cs-ph\[data-gph="T114"\]\{--r:520\/347\}\.cs-ph\[data-gph="T114"\] img\{object-fit:contain\}/);""" + "\n  " + r"""assert.match(page, /\.cs-ph-s\{display:flex;aspect-ratio:var\(--r,2\/1\)/);"""
          assert old in t, "old assertion not found"
          t = t.replace(old, new)
          old2 = r"""  assert.match(page, /\.cs-ph\{position:relative;aspect-ratio:2\/1/);"""
          new2 = r"""  assert.match(page, /\.cs-ph\{position:relative;background:#f6efe8;overflow:hidden\}/);""" + "\n  " + r"""assert.doesNotMatch(page, /\.cs-ph\{position:relative;aspect-ratio:2\/1/);"""
          assert old2 in t, "old frame assertion not found"
          open(p, "w", encoding="utf-8").write(t.replace(old2, new2))
          PYEOF
      - name: 補助ワークフローと印を消す
        run: |
          git rm -q -f --ignore-unmatch .github/workflows/photo-curated*.yml .github/workflows/photo-integrate.yml tools/integrate_trigger.txt tools/fill_ratio.py
      - run: python3 tools/rules_check.py
      - name: 新しいブランチに入れる
        run: |
          git add -A
          git commit -qm "写真と、写真の枠のページを最新の main で作りなおし" || true
          git push --force origin HEAD:refs/heads/instinct/photos-integrated
