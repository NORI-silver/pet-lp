# 埼玉の網羅スレッド専用（結果はブランチ crawl-out-saitama）。登録一覧（reg*.json）と候補の公式サイト（queue*.json）を読む。何も送らない。
name: site-snap-saitama
on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-h58oyn']
    paths: ['tools/crawl/saitama/queue*.json', 'tools/crawl/saitama/reg*.json']
permissions:
  contents: write
concurrency:
  group: site-snap-saitama
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/region_snap.py /tmp/out tools/crawl/saitama
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan crawl-out-saitama
          git rm -rq --cached . && git clean -fdq
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "埼玉の抜き出し ${GITHUB_SHA::7}"
          git push -q -f origin crawl-out-saitama
