# PRごとに SEO と文言ルールを自動で確かめる（docs/seo-agents.md）。お金はかかりません（公開リポジトリ）。
name: SEO check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成ファイルが元ファイルと合っているか
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
          git diff --stat --exit-code || (echo "tools/ を直したら python3 tools/gen_areas.py . を実行して、生成ファイルもコミットしてください"; exit 1)
      - name: SEO と文言のチェック
        run: python3 tools/seo_check.py .
      - name: 食い違いの点検（提携先の届出・税・お迎えの範囲と県・手で書いた社数・会社のない県の文）
        run: python3 tools/consistency_check.py .
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 予約のしくみと料金計算のテスト（何も送らない）
        run: for f in tests/*.test.cjs; do echo "== $f"; node "$f" || exit 1; done
