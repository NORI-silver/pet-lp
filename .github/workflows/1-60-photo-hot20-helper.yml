# rerun on main 9d8a968
# 一時の補助。ホテルの写真データ(photo-hp4 の3ファイル)を最新 main の上に載せて再生成する（確認用の branch だけ）。終わったら消す。
name: photo-hot20-helper
on:
  push:
    branches: ['NORI-silver-patch-20']
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 足す（photo-hp4 の写真データ3ファイルだけを最新 main に載せる）
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main photo-hp4
          git reset -q --hard origin/main
          git log -1 --format='base %H'
          for p in pet-hotel dog-trainer; do echo "BEFORE imgs $p: $(grep -o '<img' -r $p --include=index.html | wc -l)"; done
          for f in tools/photos.json tools/photo_permits.json tools/curated_tokyo_small.json; do
            if [ "$(git diff --stat 64916ff origin/main -- $f | wc -l)" != "0" ]; then echo "main changed $f since hp4 base: abort"; exit 1; fi
            git checkout origin/photo-hp4 -- $f
          done
          git status --short | head
          python3 - <<'PY'
          import json
          p=json.load(open('tools/photos.json',encoding='utf-8'));print({k:len(v) for k,v in p.items()})
          c=json.load(open('tools/curated_tokyo_small.json',encoding='utf-8'));print('curated',len(c))
          PY
      - name: 作り直し3回
        run: |
          for i in 1 2 3; do python3 tools/gen_areas.py . > /tmp/g$i.log 2>&1 || { tail -20 /tmp/g$i.log; exit 1; }; cp tools/lastmod.json /tmp/lm$i.json; git status --porcelain | awk '{print $2}' | sort > /tmp/ch$i.txt; echo "pass $i changed: $(wc -l < /tmp/ch$i.txt)"; done
          echo "lastmod diff 2vs1: $(diff /tmp/lm1.json /tmp/lm2.json | wc -l)  3vs2: $(diff /tmp/lm2.json /tmp/lm3.json | wc -l)  changed-set 3v2: $(diff /tmp/ch2.txt /tmp/ch3.txt | wc -l)"
          for p in pet-hotel dog-trainer; do echo "AFTER imgs $p: $(grep -o '<img' -r $p --include=index.html | wc -l)"; done
          for p in dog-trainer/index.html pet-hotel/index.html hospital/index.html; do echo "GZ $p $(gzip -9c $p | wc -c)"; done
          echo "hosp.js bytes $(wc -c < hosp.js)"
          git status --porcelain | awk '{print $2}' | awk -F/ '{print $1"/"$2}' | sort | uniq -c | sort -rn | head -8
      - name: 検査とテスト（各ゲートの終了状態を記録。何も省かない）
        run: |
          fail=0
          run(){ n="$1"; shift; rc=0; "$@" > /tmp/gate_$n.log 2>&1 || rc=$?; echo "GATE $n exit=$rc :: $(tail -2 /tmp/gate_$n.log | tr '\n' ' ' | cut -c1-200)"; if [ $rc -ne 0 ]; then fail=1; fi; }
          run seo python3 tools/seo_check.py .
          run rules python3 tools/rules_check.py .
          run feedback python3 tools/feedback_check.py .
          run consistency python3 tools/consistency_check.py .
          tf=0; tn=0
          for f in tests/*.test.cjs; do tn=$((tn+1)); rc=0; node "$f" > /tmp/one.log 2>&1 || rc=$?; if [ $rc -ne 0 ]; then tf=$((tf+1)); echo "TEST FAIL exit=$rc $f :: $(grep -E 'bytes gzipped|Error|FAIL' /tmp/one.log | head -3 | tr '\n' ' ')"; fi; done
          echo "TESTS files=$tn failed=$tf"
          if [ $tf -ne 0 ]; then fail=1; fi
          echo "ALL_GATES_EXIT=$fail"
          exit $fail
      - name: コミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/*hot20-helper.yml 2>/dev/null || true
          git add -A
          git rm -q --cached -f .github/workflows/*hot20-helper.yml 2>/dev/null || true
          git commit -qm "ホテルの写真データを最新 main の上で再生成（生成物を含む）"
          git push -f origin HEAD:refs/heads/NORI-silver-patch-21
          git log -1 --format='HEAD %H'
