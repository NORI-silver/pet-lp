# ペットと避難：まだ読めていない市区町村の公式サイトとPDFを読み、ペットの行だけをブランチ hinan-out に置く（Nori 2026-11-23）。
# 何も送らない・サイトは書き換えない。載せるかは AI が行を読んで決める。
name: hinan-snap
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['tools/crawl/hinan_queue.json', 'tools/hinan_snap.py']
permissions:
  contents: write
concurrency:
  group: hinan-snap
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: PDFを読む道具
        run: sudo apt-get install -y -q poppler-utils >/dev/null
      - name: 自治体のサイトを読む
        run: python3 tools/hinan_snap.py /tmp/out
      - name: 結果をブランチ hinan-out に置く
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan hinan-out
          git rm -rq --cached . && git clean -fdq
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "避難の公式サイトの抜き出し ${GITHUB_SHA::7}"
          git push -q -f origin hinan-out
