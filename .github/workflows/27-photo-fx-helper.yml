# 一時の補助。T-HT066の重複の写真を入れて、生成ファイルを作り直す。終わったら消す。
name: photo-fx-helper
on:
  push:
    branches: ['photo-fx-ht066']
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 写真を入れる
        run: |
          pip install pillow
          ls tools | grep -E 'fxapply|fxdata'
          cp tools/*fxapply.py /tmp/fxapply.py
          python3 /tmp/fxapply.py
      - name: 生成ファイルを作り直す
        run: |
          python3 tools/gen_areas.py .
          rm -rf tools/__pycache__
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/*fxapply.py tools/*fxdata.json
          git add -A
          git reset -q -- .github/workflows
          git commit -qm "T-HT066の重複カードを1つにする"
          git push
