# 一時の補助。動物病院46院を足して作り直す（確認用の branch だけ）。終わったら消す。
name: photo-hsall-helper
on:
  push:
    branches: ['NORI-silver-patch-2']
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 足す
        run: |
          pip install pillow
          git log -1 --format='base %H'
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin; git merge origin/main -X theirs --no-edit -m "main を取り込む" || true
          git checkout origin/main -- tools/vet_clinics.json
          mv tools/*41-hs-all-apply.py /tmp/hsapply.py
          python3 /tmp/hsapply.py
          mv tools/*30-g32016-fix.py /tmp/g32016.py; python3 /tmp/g32016.py
          mv tools/*38-g27124-tel-fix.py /tmp/g27124.py; python3 /tmp/g27124.py
          python3 - <<'PY'
          p='tools/hosp_find.py'; s=open(p,encoding='utf-8').read()
          a='    open(os.path.join(ROOT, "hosp.js"), "w", encoding="utf-8").write(js)'
          assert a in s
          s=s.replace(a,'    js = __import__("re").sub(r"var NAMES = \\[[^\\]]*\\]", lambda m: m.group(0).replace(\'", "\', \'","\'), js)  # 県名の並びの空白だけ詰める（/hosp.js は 24KB まで）\n'+a)
          open(p,'w',encoding='utf-8').write(s)
          PY
          sed -n 355,360p tools/hosp_find.py
          rm -f tools/*20-vets64.json tools/*26-vets12.json tools/*28-vets-unknown.json tools/*34-vets4.json tools/*37-vets-chunk4-20.json tools/*39-vets-chunk5-9.json tools/*40-vets-chunk7-6.json tools/*41-vets-chunk6-1.json tools/*27-hs64e-apply.py
          git diff --stat | tail -2
      - name: 作り直し2回
        run: |
          python3 tools/gen_areas.py . > /tmp/gen1.log 2>&1 || { tail -20 /tmp/gen1.log; exit 1; }
          rm -rf tools/__pycache__
          cp tools/lastmod.json /tmp/lm1.json
          python3 tools/gen_areas.py . > /tmp/gen2.log 2>&1 || { tail -20 /tmp/gen2.log; exit 1; }
          rm -rf tools/__pycache__
          echo "2nd regen vs 1st lastmod diff lines: $(diff /tmp/lm1.json tools/lastmod.json | wc -l)"
          echo "changed files: $(git status --porcelain | wc -l)"
          git status --porcelain | awk '{print $2}' | awk -F/ '{print $1"/"$2}' | sort | uniq -c | sort -rn | head -30
          echo "gz: hospital $(gzip -9c hospital/index.html | wc -c)"
          for p in $(git status --porcelain | awk '{print $2}' | grep -E '^hospital/.*index.html$'); do echo "gz $p $(gzip -9c $p | wc -c)"; done | sort -k3 -n -r | head -8
      - name: 新しい病院の判定（hospital/data の中身）
        run: |
          python3 - <<'PY'
          import json,glob
          new=json.load(open('tools/vet_clinics.json',encoding='utf-8'))['clinics'][-189:]
          names={(c['name']) for c in new}
          print('new records',len(new),'unique ids',len({c['id'] for c in new}))
          seen=0
          for f in sorted(glob.glob('hospital/data/*.json')):
              for r in json.load(open(f,encoding='utf-8')):
                  if r.get('n') in names:
                      seen+=1; print(f.split('/')[-1],r['n'],'|a:',r.get('a'),'|y:',','.join(r.get('y',[])),'|no:',','.join(r.get('no',[])),'|pg:',r.get('pg'),'|tel' if r.get('tel') else '')
          print('seen in hospital/data',seen)
          PY
      - name: 検査（SEO・決まり・台帳・食い違い）
        run: |
          (python3 tools/seo_check.py . || echo SEO_FAILED; python3 tools/rules_check.py . | tail -2; python3 tools/feedback_check.py . | tail -1; python3 tools/consistency_check.py . | tail -1) 2>&1 | tee /tmp/gates.log
      - name: テスト
        run: |
          rm -f /tmp/tf
          for f in tests/*.test.cjs; do echo "== $f"; node "$f" > /tmp/one.log 2>&1 || { echo "FAILED $f"; tail -40 /tmp/one.log; touch /tmp/tf; }; done 2>&1 | tee /tmp/tests.log
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/gates.log tools/_gates.txt; cp /tmp/tests.log tools/_tests.txt
          git add -A
          git reset -q -- .github/workflows
          if [ -f /tmp/tf ]; then
            git commit -qm "DIAG: tests failed (not for merge)"
            git push -f origin HEAD:refs/heads/diag-hs151
          else
            git rm -q --cached tools/_gates.txt tools/_tests.txt; rm -f tools/_gates.txt tools/_tests.txt
            git commit -qm "動物病院189院を足す（診る動物が書いていない所は要確認のまま）。島根の益田ペットクリニックと大阪の東寝屋川医療センターの電話を直す"
            git push
          fi
